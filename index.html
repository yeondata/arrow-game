<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>화살표 게임 - 보드 생성</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #e9ddbd;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
  }
  h1 { font-size: 16px; color: #5a3a22; margin: 14px 0 6px; }
  #meta { color: #6b4a2e; font-size: 13px; margin-bottom: 8px; }
  button {
    margin-bottom: 12px;
    padding: 6px 14px;
    border: 1px solid #7a4b2e;
    background: #f3e7c9;
    color: #5a3a22;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #e6d6ab; }
  canvas { background: #f3e7c9; border: 1px solid #c9b585; }
</style>
</head>
<body>
  <h1>화살표 게임 — 22×22 보드 생성 (풀이 시뮬레이션 없이 생성/렌더링만)</h1>
  <button id="regen">다시 생성</button>
  <div id="meta"></div>
  <canvas id="board"></canvas>

<script>
const GRID = 22;
const CELL = 26;
const MARGIN = 30;
const LINE_COLOR = "#77492c";
const LINE_COLOR_ESCAPABLE = "rgba(119, 73, 44, 0.32)";
const BG_COLOR = "#f3e7c9";

const PARAMS = {
  straightProb: 0.7,
  minLen: 3,
  maxLen: 22,
  stopProb: 0.06,
  maxAttempts: 800,
};

const DIRS = [[0,-1],[0,1],[-1,0],[1,0]]; // up, down, left, right

function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function addDir(cell, d) { return [cell[0] + d[0], cell[1] + d[1]]; }
function perpendiculars(d) { return [[d[1], -d[0]], [-d[1], d[0]]]; }

function inBounds(cell) {
  return cell[0] >= 0 && cell[0] < GRID && cell[1] >= 0 && cell[1] < GRID;
}

function isValidCell(cell, path, board) {
  const [c, r] = cell;
  if (!inBounds(cell)) return false;
  if (path.some(p => p[0] === c && p[1] === r)) return false;
  if (board[r][c] !== null) return false;
  return true;
}

function isOpposite(a, b) { return a[0] === -b[0] && a[1] === -b[1]; }

// 4.2-3의 1~3번 규칙: 방향 d의 연장선(보드 끝까지) 위 어디든 자기 몸통이 있거나,
// 나를 향한(headDir가 정반대인) 다른 화살표의 "머리"가 있으면 그 방향은 "안좋음".
// 다른 화살표의 몸통이 중간에 가리고 있어도 멈추지 않고 보드 끝까지 계속 확인한다.
// (다른 화살표의 몸통 중간을 지나는 것 자체는 문제 없음 — 그 화살표의 머리가 나를
// 마주보고 있는지만 본다)
function isBadDir(pos, d, path, board, arrows) {
  let cur = addDir(pos, d);
  while (inBounds(cur)) {
    if (path.some(p => p[0] === cur[0] && p[1] === cur[1])) return true;
    const occ = board[cur[1]][cur[0]];
    if (occ !== null) {
      const other = arrows[occ];
      const otherHead = other.path[other.path.length - 1];
      if (cur[0] === otherHead[0] && cur[1] === otherHead[1] && isOpposite(other.headDir, d)) return true;
    }
    cur = addDir(cur, d);
  }
  return false;
}

// 4.1~4.3: 화살표 하나 생성
function growArrow(tail, board, arrows) {
  const path = [tail];
  let dir = randomChoice(DIRS);

  while (true) {
    const last = path[path.length - 1];
    const [p1, p2] = perpendiculars(dir);

    const straightCand = { d: dir, bad: isBadDir(last, dir, path, board, arrows) };
    const curvePair = shuffle([
      { d: p1, bad: isBadDir(last, p1, path, board, arrows) },
      { d: p2, bad: isBadDir(last, p2, path, board, arrows) },
    ]);

    // 4.2-1 의도(직선 70% / 커브 30%)를 우선순위로 삼되, "안좋음(자기몸통과 겹치거나
    // 나를 향해 마주보는 화살표가 연장선상에 있음)"으로 판정된 방향은 아예 후보에서 제외한다.
    // 커브 두 방향 다 안되면 직진, 직진도 안되면 U턴, U턴도 안되면 정지(4.2-3).
    const order = Math.random() < PARAMS.straightProb
      ? [straightCand, ...curvePair]
      : [...curvePair, straightCand];

    let next = null, newDir = null;
    for (const cand of order) {
      if (cand.bad) continue;
      const nc = addDir(last, cand.d);
      if (isValidCell(nc, path, board)) { next = nc; newDir = cand.d; break; }
    }

    if (next) {
      path.push(next);
      dir = newDir;
    } else {
      // 4.2-3: 커브나 직진이 안되면 U턴 (좌 or 우로 1칸씩 두 번 이동, 역시 마주보기 금지 적용)
      let didUturn = false;
      for (const perp of shuffle([p1, p2])) {
        if (isBadDir(last, perp, path, board, arrows)) continue;
        const mid = addDir(last, perp);
        if (!isValidCell(mid, path, board)) continue;
        if (isBadDir(mid, perp, path.concat([mid]), board, arrows)) continue;
        const end = addDir(mid, perp);
        if (isValidCell(end, path.concat([mid]), board)) {
          path.push(mid, end);
          dir = perp;
          didUturn = true;
          break;
        }
      }
      if (!didUturn) break; // 커브, 직진, U턴이 안되면 멈춤
    }

    if (path.length >= PARAMS.maxLen) break;
    if (path.length >= PARAMS.minLen && Math.random() < PARAMS.stopProb) break;
  }

  return path;
}

function isAdjacent(a, b) {
  return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
}

// 어떤 화살표의 머리가 다른 화살표의 꼬리와 맞닿아 있으면 하나의 화살표로 합친다
function mergeConnectedArrows(arrows) {
  let list = arrows.map(a => ({ path: a.path, minId: a.id }));
  let mergedAny = true;
  while (mergedAny) {
    mergedAny = false;
    for (let i = 0; i < list.length && !mergedAny; i++) {
      const head = list[i].path[list[i].path.length - 1];
      for (let j = 0; j < list.length; j++) {
        if (i === j) continue;
        const tail = list[j].path[0];
        if (isAdjacent(head, tail)) {
          const merged = {
            path: list[i].path.concat(list[j].path),
            minId: Math.min(list[i].minId, list[j].minId),
          };
          list = list.filter((_, idx) => idx !== i && idx !== j);
          list.push(merged);
          mergedAny = true;
          break;
        }
      }
    }
  }
  return list
    .sort((a, b) => a.minId - b.minId)
    .map((a, idx) => {
      const head = a.path[a.path.length - 1];
      const prev = a.path[a.path.length - 2];
      return { id: idx, path: a.path, headDir: [head[0] - prev[0], head[1] - prev[1]] };
    });
}

// 5장: 보드 전체 생성 (5-4, 5-5 솔버 검증은 생략)
function generateBoard() {
  const board = Array.from({ length: GRID }, () => Array(GRID).fill(null));
  const arrows = [];
  let emptyCount = GRID * GRID;
  let attempts = 0;
  let nextId = 0;

  while (emptyCount > 0 && attempts < PARAMS.maxAttempts) {
    attempts++;
    const emptyCells = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        if (board[r][c] === null) emptyCells.push([c, r]);
    if (emptyCells.length === 0) break;

    const tail = randomChoice(emptyCells);
    const path = growArrow(tail, board, arrows);
    if (path.length < PARAMS.minLen) continue; // 짧은 화살표 폐기, 재시도

    const id = nextId++;
    for (const [c, r] of path) board[r][c] = id;
    const head = path[path.length - 1];
    const prev = path[path.length - 2];
    arrows.push({ id, path, headDir: [head[0] - prev[0], head[1] - prev[1]] });
    emptyCount -= path.length;
  }

  const mergedArrows = mergeConnectedArrows(arrows);
  return { board: rebuildBoard(mergedArrows), arrows: mergedArrows, emptyCount };
}

function rebuildBoard(arrows) {
  const board = Array.from({ length: GRID }, () => Array(GRID).fill(null));
  for (const a of arrows) for (const [c, r] of a.path) board[r][c] = a.id;
  return board;
}

// 6장: 지금 이 상태 그대로, 머리 방향으로 곧장 나아가 보드 밖까지 나갈 수 있는지(=현재 탈출 가능한지) 계산
function canEscapeNow(arrow, board) {
  const head = arrow.path[arrow.path.length - 1];
  const [dx, dy] = arrow.headDir;
  let cur = [head[0] + dx, head[1] + dy];
  while (inBounds(cur)) {
    const occ = board[cur[1]][cur[0]];
    if (occ !== null && occ !== arrow.id) return false;
    cur = [cur[0] + dx, cur[1] + dy];
  }
  return true;
}

// 시뮬레이션: 지금 당장 탈출 가능한 화살표를 하나씩 빼내고, 그로 인해 새로 풀리는
// 화살표가 없어질 때까지 반복한다. 이 과정에서 한 번이라도 빠져나갈 수 있었던
// 화살표는 "탈출 가능"(연하게), 끝까지 아무 순서로도 못 빠져나가면 "막힘"(진하게).
function simulateEscapable(arrows, board) {
  const workBoard = board.map(row => row.slice());
  const remaining = new Map(arrows.map(a => [a.id, a]));
  const escapable = new Set();
  let changed = true;
  while (changed) {
    changed = false;
    for (const [id, a] of Array.from(remaining)) {
      if (canEscapeNow(a, workBoard)) {
        escapable.add(id);
        remaining.delete(id);
        for (const [c, r] of a.path) workBoard[r][c] = null;
        changed = true;
      }
    }
  }
  return escapable;
}

function cellCenter(c, r) {
  return [MARGIN + c * CELL + CELL / 2, MARGIN + r * CELL + CELL / 2];
}

function drawArrow(ctx, arrow, order, color) {
  const { path, headDir } = arrow;
  ctx.strokeStyle = color;
  ctx.lineWidth = CELL * 0.38;
  ctx.lineJoin = "miter";
  ctx.lineCap = "butt";
  ctx.beginPath();
  path.forEach(([c, r], i) => {
    const [x, y] = cellCenter(c, r);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 화살촉 (머리 칸에서 headDir 방향)
  const [hc, hr] = path[path.length - 1];
  const [cx, cy] = cellCenter(hc, hr);
  const [dx, dy] = headDir;
  const [px, py] = [dy, -dx]; // 화살촉 밑변에 수직인 방향
  const tipLen = CELL * 0.62;
  const baseW = CELL * 0.62;
  const baseX = cx - dx * (CELL * 0.16);
  const baseY = cy - dy * (CELL * 0.16);
  const tipX = cx + dx * tipLen;
  const tipY = cy + dy * tipLen;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(baseX + px * baseW / 2, baseY + py * baseW / 2);
  ctx.lineTo(baseX - px * baseW / 2, baseY - py * baseW / 2);
  ctx.closePath();
  ctx.fill();

  // 꼬리에 생성 순서 표시
  const [tc, tr] = path[0];
  const [tx, ty] = cellCenter(tc, tr);
  const labelR = CELL * 0.34;
  ctx.fillStyle = BG_COLOR;
  ctx.beginPath();
  ctx.arc(tx, ty, labelR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.font = `bold ${Math.round(CELL * 0.42)}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(order), tx, ty + 1);
}

function render() {
  const { board, arrows, emptyCount } = generateBoard();
  const canvas = document.getElementById("board");
  const size = GRID * CELL + MARGIN * 2;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, size, size);

  const escapableIds = simulateEscapable(arrows, board);
  arrows.forEach((a, i) => {
    drawArrow(ctx, a, i + 1, escapableIds.has(a.id) ? LINE_COLOR_ESCAPABLE : LINE_COLOR);
  });
  const escapableCount = escapableIds.size;

  document.getElementById("meta").textContent =
    `화살표 ${arrows.length}개 생성 (탈출 가능 ${escapableCount} · 막힘 ${arrows.length - escapableCount}) · 빈 칸 ${emptyCount}칸`;
}

document.getElementById("regen").addEventListener("click", render);
render();
</script>
</body>
</html>
